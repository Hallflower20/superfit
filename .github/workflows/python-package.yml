# Tests and packaging checks for superfit.
#
# The template bank is a 74 MB download and is not fetched here, so the
# end-to-end tests marked `endtoend` skip themselves (see needs_bank in
# superfit/tests/conftest.py). Everything else -- the fitting kernel against
# its reference implementation, the error routines, Spectrum, config
# validation -- runs without it.

name: Test superfit

on:
  push:
    branches: [main, master, sam-dev, xander-dev]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test,speed]"

      - name: Import without a template bank
        # A fresh install must be importable before anyone downloads 74 MB.
        run: python -c "import superfit; print(superfit.__version__)"

      - name: Lint for real errors
        run: |
          python -m pip install flake8
          flake8 superfit --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Test
        env:
          MPLBACKEND: Agg
        run: pytest -q

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Check metadata
        run: python -m twine check dist/*

      - name: Refuse to ship the template bank
        # The bank is gitignored, but a stray copy in a working tree would be
        # swept into the sdist and rejected by PyPI. Fail loudly and early.
        run: |
          if tar tzf dist/*.tar.gz | grep -Ei 'bank/|supyfit_bank\.zip'; then
            echo "::error::template bank leaked into the sdist"
            exit 1
          fi
          echo "sdist is clean"

      - name: Install the wheel in a clean environment and use it
        run: |
          python -m venv /tmp/fresh
          /tmp/fresh/bin/pip install --quiet dist/*.whl
          cd /tmp
          /tmp/fresh/bin/python -c "import superfit; print(superfit.__version__)"
          /tmp/fresh/bin/superfit --help > /dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
